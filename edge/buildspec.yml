version: 0.2

# CodePipeline のソースはリポジトリルートなので、各コマンドは edge/ で実行する。
# 0.2 では cd が後続コマンドに引き継がれるため、毎回絶対パスで移動する。
# CodeBuild プロジェクト側で buildspec のパスに edge/buildspec.yml を指定し、
# 環境変数 STAGE（dev / prd）を渡す想定。
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - cd "$CODEBUILD_SRC_DIR/edge" && npm ci
  pre_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/edge" && npm run typecheck
      - cd "$CODEBUILD_SRC_DIR/edge" && npm test
  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/edge" && STAGE=${STAGE:-dev} npm run build

artifacts:
  base-directory: edge/dist
  files:
    - "*.zip"
